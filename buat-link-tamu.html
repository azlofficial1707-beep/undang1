<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buat Link Undangan Personal</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#f7f3eb;color:#344238;font-family:Arial,sans-serif}
main{max-width:560px;margin:30px auto;background:white;padding:28px;border:1px solid #e5dccd;border-radius:8px}
h1{font-family:Georgia,serif;text-align:center;font-weight:normal;color:#24372d}
p{line-height:1.6;color:#778078;font-size:14px}label{display:block;margin:22px 0 8px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #d9cfbc;border-radius:5px;font-size:16px}
button{margin-top:14px;padding:13px 18px;background:#c6a875;color:#17231e;border:0;border-radius:4px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;padding:14px;background:#f7f3eb;overflow-wrap:anywhere;display:none}
small{color:#778078}
</style></head><body><main>
<h1>Buat Link Undangan</h1>
<p>Masukkan nama tamu. Sistem akan membuat link undangan pribadi yang menampilkan tulisan “Kepada Yth.” beserta nama tamu tersebut.</p>
<label for="guest">Nama tamu undangan</label>
<input id="guest" placeholder="Contoh: Bapak Andi & keluarga">
<button onclick="makeLink()">Buat Link Personal</button>
<div id="result"><strong>Link undangan:</strong><p id="url"></p>
<button onclick="copyLink()">Salin Link</button>
<button onclick="shareLink()">Bagikan WhatsApp</button></div>
<p><small>Halaman ini hanya alat pembuat link tamu. Pengaturan isi undangan utama tetap dilakukan pada file website sebelum dipublikasikan.</small></p>
</main><script>
const base='https://azlofficial1707-beep.github.io/undangg/';
let generated='';
function makeLink(){const n=document.getElementById('guest').value.trim();if(!n){alert('Masukkan nama tamu terlebih dahulu.');return;}
generated=base+'?to='+encodeURIComponent(n);document.getElementById('url').textContent=generated;document.getElementById('result').style.display='block';}
async function copyLink(){try{await navigator.clipboard.writeText(generated);alert('Link berhasil disalin.');}catch(e){prompt('Salin link berikut:',generated);}}
function shareLink(){if(!generated)return;const n=document.getElementById('guest').value.trim();location.href='https://wa.me/?text='+encodeURIComponent('Assalamu’alaikum '+n+', kami mengundang Anda untuk hadir di acara pernikahan kami. Silakan buka undangan berikut: '+generated);}
</script></body></html>
